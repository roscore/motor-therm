[package]
name = "mt_web"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Browser UI for motor-therm (WebGL2 + canvas 2D)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mt_core = { path = "../mt_core" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement",
  "HtmlSelectElement", "Node", "NodeList", "DomTokenList", "CssStyleDeclaration", "Navigator",
  "MediaQueryList", "Event", "EventTarget", "MouseEvent", "PointerEvent", "WheelEvent",
  "CanvasRenderingContext2d", "TextMetrics", "DomRect", "console",
  "WebGl2RenderingContext", "WebGlBuffer", "WebGlProgram", "WebGlShader",
  "WebGlUniformLocation", "WebGlVertexArrayObject", "WebGlContextAttributes",
]
